<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090f">
<title>移动工作台</title>
<style>
  :root{
    --bg:#07090f;--panel:rgba(255,255,255,.045);--panel-2:rgba(255,255,255,.075);
    --bd:rgba(255,255,255,.1);--bd-2:rgba(255,255,255,.16);
    --fg:#eef1f7;--muted:#8e96a9;--faint:#606878;
    --gold:#d8b878;--gold-2:#b9904e;--gold-ink:#ead6a9;--err:#ff7d86;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;
    padding:max(24px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom));
    background:
      radial-gradient(560px 420px at 50% -12%,rgba(216,184,120,.17),transparent 68%),
      radial-gradient(520px 420px at 50% 112%,rgba(73,101,210,.15),transparent 68%),
      var(--bg);
    color:var(--fg);font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  .card{
    position:relative;width:min(400px,100%);padding:32px 26px 24px;text-align:left;
    border:1px solid var(--bd-2);border-radius:26px;
    background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.022) 48%,rgba(255,255,255,.04));
    box-shadow:0 30px 90px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.08) inset;
    -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);overflow:hidden;
  }
  .card::after{
    content:'';position:absolute;right:-90px;top:-110px;width:250px;height:250px;border-radius:50%;
    border:1px solid rgba(216,184,120,.14);
    box-shadow:0 0 0 32px rgba(216,184,120,.022),0 0 0 70px rgba(216,184,120,.012);
    pointer-events:none;
  }
  .logo{
    display:grid;place-items:center;width:58px;height:58px;margin-bottom:18px;border-radius:18px;
    color:#1a1305;font-size:26px;font-weight:800;letter-spacing:-.05em;
    background:linear-gradient(145deg,#f4e3b9,#d5af6c 58%,#b48643);
    box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 14px 34px rgba(0,0,0,.4);
  }
  .kicker{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:600}
  h1{font-size:31px;line-height:1.12;letter-spacing:-.035em;font-weight:650;margin:5px 0 8px}
  .sub{
    display:inline-flex;align-items:center;gap:7px;max-width:100%;
    color:var(--muted);font-size:11.5px;line-height:1.5;word-break:break-all;
    padding:5px 10px;border:1px solid var(--bd);border-radius:999px;background:rgba(255,255,255,.025);
  }
  .sub::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 9px rgba(216,184,120,.6);flex:none}
  .status{margin-top:18px;color:var(--muted);font-size:12.5px;min-height:22px;display:flex;align-items:center;gap:7px}
  .status.err{color:var(--err)}
  .spin{
    width:14px;height:14px;border:1.5px solid rgba(216,184,120,.22);border-top-color:var(--gold);
    border-radius:50%;display:inline-block;animation:sp .75s linear infinite;flex:none;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
  .setup{display:none;margin-top:16px;text-align:left;padding-top:16px;border-top:1px solid var(--bd)}
  .setup.on{display:block}
  .setup label{display:block;color:var(--muted);font-size:11px;letter-spacing:.04em;margin:0 0 6px}
  .setup input{
    width:100%;padding:12px 13px;border-radius:12px;background:rgba(255,255,255,.05);
    border:1px solid var(--bd-2);color:var(--fg);font:inherit;font-size:12.5px;outline:none;
  }
  .setup input:focus{border-color:rgba(216,184,120,.58);box-shadow:0 0 0 3px rgba(216,184,120,.12)}
  .setup button{
    margin-top:11px;width:100%;padding:12px;border:none;border-radius:12px;
    color:#191307;font:inherit;font-size:13.5px;font-weight:650;cursor:pointer;
    background:linear-gradient(135deg,#ecd8a6,#d3ad69 52%,#bd914c);
    box-shadow:0 1px 0 rgba(255,255,255,.38) inset,0 12px 26px rgba(0,0,0,.3);
  }
  .setup button:active{transform:translateY(1px)}
  .setup .hint{color:var(--faint);font-size:10.5px;line-height:1.55;margin-top:9px}
  .gear{margin-top:20px;color:var(--faint);font-size:11px;cursor:pointer;display:inline-block;letter-spacing:.02em}
  .gear:active{color:var(--gold)}
</style>
</head>
<body>
<div class="card">
  <div class="logo">W</div>
  <div class="kicker">Personal Workbench</div>
  <h1>移动工作台</h1>
  <div class="sub" id="addr"></div>
  <div class="status" id="status"><span class="spin"></span>正在连接…</div>
  <div class="setup" id="setup">
    <label>工作台服务器地址</label>
    <input id="urlInput" placeholder="http://100.103.226.87:8080" autocomplete="off">
    <button id="saveBtn">保存并连接</button>
    <div class="hint">Tailscale 开启时用 100.x 地址；公网域名上线后填域名地址</div>
  </div>
  <div class="gear" id="gear">服务器设置</div>
</div>
<script>
const DEFAULT = 'http://100.103.226.87:8080';
const $ = s => document.querySelector(s);
const addr = () => localStorage.getItem('server_url') || DEFAULT;

async function probe(url) {
  // no-cors 探测：能建立连接即认为可达（opaque 响应，读不了状态码）
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 5000);
  try {
    await fetch(url + '/api/health', { mode: 'no-cors', signal: ctl.signal, cache: 'no-store' });
    clearTimeout(t);
    return true;
  } catch (e) {
    clearTimeout(t);
    return false;
  }
}

function showSetup(errMsg) {
  const st = $('#status');
  st.className = 'status err';
  st.textContent = errMsg || '无法连接服务器';
  $('#setup').classList.add('on');
  $('#urlInput').value = addr();
}

async function go(url) {
  $('#status').className = 'status';
  $('#status').innerHTML = '<span class="spin"></span>已连通，进入工作台…';
  setTimeout(() => { location.replace(url); }, 300);
}

(async () => {
  const url = addr();
  $('#addr').textContent = url;
  const ok = await probe(url);
  if (ok) { go(url); return; }
  // 再试一次（VPN 刚启动时路由可能没就绪）
  await new Promise(r => setTimeout(r, 2500));
  if (await probe(url)) { go(url); return; }
  showSetup('连接不上服务器（Tailscale 开了吗？）');
})();

$('#gear').onclick = () => { $('#setup').classList.add('on'); $('#urlInput').value = addr(); };
$('#saveBtn').onclick = async () => {
  let u = $('#urlInput').value.trim().replace(/\/+$/, '');
  if (!/^https?:\/\//.test(u)) u = 'http://' + u;
  if (!u) return;
  localStorage.setItem('server_url', u);
  $('#addr').textContent = u;
  $('#status').className = 'status';
  $('#status').innerHTML = '<span class="spin"></span>正在探测…';
  if (await probe(u)) { go(u); }
  else { $('#status').className = 'status err'; $('#status').textContent = '这个地址也连不上'; }
};
</script>
</body>
</html>
