<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小红书热门</title>
<style>
  :root{
    --bg:#07090f;--panel:rgba(255,255,255,.045);--panel2:rgba(255,255,255,.07);--bd:rgba(255,255,255,.085);
    --bd2:rgba(255,255,255,.15);--fg:#eef1f7;--muted:#8e96a9;--faint:#606878;
    --acc:#d8b878;--acc2:#ead6a9;--err:#ff7d86;--ok:#5ec8a0;
    --safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom)
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;color:var(--fg);height:100dvh;display:flex;flex-direction:column;overflow:hidden;
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    background:radial-gradient(900px 600px at 92% -10%,rgba(216,184,120,.1),transparent 62%),
      radial-gradient(800px 600px at -10% 20%,rgba(74,104,214,.11),transparent 62%),var(--bg)}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border:3px solid transparent;border-radius:999px;background-clip:content-box}
  button{font:inherit;cursor:pointer;border:none;border-radius:10px;background:var(--panel2);color:var(--fg)}
  button:disabled{opacity:.45}
  .topbar{display:flex;align-items:center;gap:10px;padding:calc(11px + var(--safe-top)) 14px 11px;border-bottom:1px solid var(--bd);
    background:linear-gradient(180deg,rgba(7,9,15,.96),rgba(7,9,15,.74));position:sticky;top:0;z-index:5;
    -webkit-backdrop-filter:blur(24px) saturate(150%);backdrop-filter:blur(24px) saturate(150%)}
  .topbar .title{font-weight:650;font-size:15px;letter-spacing:-.01em}
  .topbar .spacer{flex:1}
  .dot{font-size:11px;color:var(--muted);border:1px solid var(--bd);border-radius:999px;padding:4px 10px;background:rgba(255,255,255,.03);white-space:nowrap}
  .icon{background:transparent;color:var(--fg-dim,#c9cfdb);font-size:17px;padding:6px 8px;border-radius:10px}
  .icon:hover{background:rgba(255,255,255,.07)}
  .back{color:var(--muted);text-decoration:none;font-size:12px;flex:none;padding:5px 8px;border:1px solid var(--bd);border-radius:9px}
  .back:hover{color:var(--acc2);border-color:rgba(216,184,120,.25)}
  .hchips{display:flex;gap:7px;padding:11px 14px;overflow-x:auto;border-bottom:1px solid var(--bd)}
  .hchip{flex:none;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.045);border:1px solid transparent;
    border-radius:999px;padding:7px 13px;font-size:12px;color:var(--muted);font-weight:550}
  .hchip.on{background:rgba(216,184,120,.12);color:var(--acc2);border-color:rgba(216,184,120,.26)}
  .hchip.off{opacity:.55}
  .hscroll{flex:1;min-height:0;overflow:auto;padding-bottom:calc(10px + var(--safe-bottom))}
  .hcompose{margin:12px 12px 8px;background:linear-gradient(155deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
    border:1px solid var(--bd);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:9px;
    box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 26px rgba(0,0,0,.2)}
  .hcompose-ta{width:100%;border:none;outline:none;resize:vertical;background:transparent;color:var(--fg);
    font:inherit;font-size:13.5px;min-height:44px}
  .hcompose-ta::placeholder{color:var(--faint)}
  .hcompose-imgs{display:flex;flex-wrap:wrap;gap:6px}
  .hcompose-img{position:relative;width:56px;height:56px;border-radius:10px;overflow:hidden;border:1px solid var(--bd2)}
  .hcompose-img img{width:100%;height:100%;object-fit:cover;display:block}
  .hcompose-del{position:absolute;top:0;right:0;width:18px;height:18px;line-height:16px;border:none;border-radius:0 0 0 8px;
    background:rgba(0,0,0,.6);color:#fff;font-size:12px;cursor:pointer;padding:0}
  .hcompose-row{display:flex;align-items:center;gap:8px}
  .hcompose-file{flex:none;font-size:12px;color:var(--acc2);background:rgba(216,184,120,.11);border:1px solid rgba(216,184,120,.2);
    border-radius:9px;padding:8px 12px;cursor:pointer;font-weight:550}
  .hcompose-vis{flex:none;font-size:11.5px;color:var(--muted);background:transparent;border:1px solid var(--bd2);border-radius:9px;padding:8px 10px}
  .hcompose-send{flex:1;color:#191307;border:none;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:650;
    background:linear-gradient(135deg,#ecd8a6,#d3ad69 52%,#bd914c);box-shadow:0 1px 0 rgba(255,255,255,.34) inset}
  .hauto{padding:10px 14px;font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.025);border-bottom:1px solid var(--bd)}
  .hauto b{color:var(--acc2)}
  .hlist{list-style:none;margin:0;padding:4px 12px 14px}
  .hitem{display:flex;align-items:center;gap:10px;padding:12px 11px;border-radius:12px}
  .hitem + .hitem{box-shadow:0 -1px 0 rgba(255,255,255,.055)}
  .hitem:hover{background:rgba(255,255,255,.035)}
  .hrank{flex:none;width:23px;text-align:center;font-size:13px;font-weight:650;color:var(--faint);font-variant-numeric:tabular-nums}
  .hrank.top1{color:var(--acc)}.hrank.top2{color:#cdb28a}.hrank.top3{color:#9d8b70}
  .hbody{flex:1;min-width:0}
  .htitle{display:block;font-size:14px;line-height:1.42;font-weight:520}
  .hmetric{margin-left:8px;font-size:12.5px;font-weight:650;color:var(--acc2);font-variant-numeric:tabular-nums}
  .hmeta{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:10.5px;color:var(--faint);flex-wrap:wrap}
  .htop{margin-top:4px;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hfoot{flex:none;border-top:1px solid var(--bd);padding:9px 14px calc(9px + var(--safe-bottom));font-size:10.5px;color:var(--faint);
    display:flex;flex-direction:column;gap:8px;background:linear-gradient(180deg,rgba(7,9,15,.7),rgba(7,9,15,.96));
    -webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
  .hfoot-row{display:flex;gap:8px}
  .hfoot-btn{flex:1;background:rgba(255,255,255,.05);color:var(--fg-dim,#c9cfdb);border:1px solid var(--bd);border-radius:10px;padding:10px 6px;font-size:12px;font-weight:550}
  .hfoot-btn:hover{background:rgba(216,184,120,.1);color:var(--acc2);border-color:rgba(216,184,120,.22)}
  .hfoot-btn:disabled{opacity:.5}
  .err{color:var(--err);font-size:12px;padding:10px 14px}
  .muted{color:var(--muted);padding:18px 16px;font-size:12.5px;text-align:center}
  .spin{width:13px;height:13px;border:1.5px solid rgba(216,184,120,.22);border-top-color:var(--acc);border-radius:50%;
    display:inline-block;animation:sp .75s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(24,20,12,.96);border:1px solid rgba(216,184,120,.32);
    color:var(--acc2);padding:9px 16px;border-radius:11px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:86vw;
    box-shadow:0 16px 40px rgba(0,0,0,.45);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
  .toast.on{opacity:1}
</style>
</head>
<body>
<header class="topbar">
  <a class="back" href="/">← 工作台</a>
  <span class="title">小红书热门</span>
  <div style="flex:1"></div>
  <span class="dot" id="snapWhen"></span>
  <button class="icon" id="refreshBtn" title="重新抓取">⟳</button>
</header>
<div class="hchips" id="chips">
  <button class="hchip on" data-m="medLikes">热度</button>
  <button class="hchip" data-m="medCol">收藏率</button>
  <button class="hchip" data-m="medSh">转发率</button>
  <span class="hchip off" id="scanningChip" style="display:none">抓取中…</span>
</div>
<div class="hscroll">
  <div class="hcompose">
    <textarea class="hcompose-ta" rows="2" placeholder="想发点什么？写个主题或想法就行，配图可选～" id="compose"></textarea>
    <div class="hcompose-imgs" id="imgs"></div>
    <div class="hcompose-row">
      <label class="hcompose-file">+ 图片<input type="file" accept="image/*" multiple hidden id="fileInput"></label>
      <button type="button" class="hcompose-vis" id="visBtn">公开</button>
      <button type="button" class="hcompose-send" id="sendBtn" disabled>发布</button>
    </div>
  </div>
  <div class="err" id="err" style="display:none"></div>
  <div class="hauto" id="auto" style="display:none"></div>
  <div class="muted" id="empty" style="display:none">还没有数据。点右上角 ⟳ 抓一轮（约 5~8 分钟，22 个品类）。</div>
  <ul class="hlist" id="list"></ul>
</div>
<div class="hfoot">
  <span class="hfoot-line" id="footLine">榜单每日 8 点更新 · 试发均为「仅自己可见」</span>
  <div class="hfoot-row">
    <button class="hfoot-btn" data-type="question">试发提问帖</button>
    <button class="hfoot-btn" data-type="devlog">试发代码日常</button>
    <button class="hfoot-btn" data-type="figure">试发人物观点</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
let DATA = null, IND = null, METRIC = 'medLikes', IMGS = [], VIS = '公开可见', BUSY = '';

const pct = (v) => Math.round((Number(v) || 0) * 100) + '%';
function fmtNum(v) { const n = Number(v) || 0; if (n >= 1e4) return (n / 1e4).toFixed(1).replace(/\.0$/, '') + '万'; return String(Math.round(n)); }
const TYPE_LABEL = (t) => (t === 'ai' ? 'AI分享' : t === 'figure' ? '人物观点' : t === 'devlog' ? '代码日常' : t === 'hot' ? '热点解读' : t === 'weekly' ? '汇总帖' : '提问帖');
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1600); }

async function api(path, body) {
  const opt = body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {};
  const r = await fetch(path, opt);
  return r.json();
}

async function load() {
  try {
    DATA = await api('api/xhs-radar');
    $('#err').style.display = 'none';
  } catch (e) { $('#err').textContent = e.message; $('#err').style.display = 'block'; return; }
  try { IND = await api('indicator'); } catch { IND = null; }
  render();
}

function render() {
  const d = DATA || {};
  const when = d.latest && d.latest.generatedAt ? new Date(d.latest.generatedAt) : null;
  $('#snapWhen').textContent = when ? `${when.getMonth() + 1}/${when.getDate()} ${String(when.getHours()).padStart(2, '0')}:${String(when.getMinutes()).padStart(2, '0')}` : '';
  $('#scanningChip').style.display = d.scanning ? 'inline-flex' : 'none';
  $('#refreshBtn').disabled = !!d.scanning;
  const list = (d.latest?.keywords || []).filter((k) => !k.err && k.n > 0).sort((a, b) => (b[METRIC] || 0) - (a[METRIC] || 0));
  const m = { medLikes: (k) => fmtNum(k.medLikes) + ' 赞', medCol: (k) => pct(k.medCol), medSh: (k) => pct(k.medSh) }[METRIC];
  $('#list').innerHTML = list.map((k, i) => `
    <li class="hitem">
      <span class="hrank ${i < 3 ? 'top' + (i + 1) : ''}">${i + 1}</span>
      <div class="hbody">
        <div class="htitle">${esc(k.kw)}<span class="hmetric">${m(k)}</span></div>
        <div class="hmeta"><span>中位 ${fmtNum(k.medLikes)} 赞</span><span>收 ${pct(k.medCol)}</span><span>转 ${pct(k.medSh)}</span><span>视频 ${pct(k.videoRatio)}</span></div>
        ${k.topTitle ? `<div class="htop">热帖：${esc(k.topTitle)}（${fmtNum(k.topLikes)} 赞）</div>` : ''}
      </div>
    </li>`).join('');
  $('#empty').style.display = (!d.latest && !d.scanning) ? 'block' : 'none';
  $('#empty').textContent = d.lastError ? '上次抓取失败：' + d.lastError : '还没有数据。点右上角 ⟳ 抓一轮（约 5~8 分钟，22 个品类）。';
  const ap = d.autopost || {};
  const ind = IND || {};
  const autoTop = (d.latest?.keywords || []).filter((k) => !k.err && k.n > 0).sort((a, b) => (b[ap.metric || 'medLikes'] || 0) - (a[ap.metric || 'medLikes'] || 0))[0];
  $('#auto').style.display = 'block';
  $('#auto').innerHTML = (ind.next
      ? `下一条：<b>${ind.next.isToday ? '今天' : (ind.next.date || '').slice(5)} ${ind.next.slot}</b> · ${ind.next.typeLabel || ''}`
      : '近 7 天无排期')
    + ` · 今日 ${(ind.today || []).filter((p) => p.done).length}/${(ind.today || []).length}`
    + (autoTop ? ` · 当前榜首 <b>${esc(autoTop.kw)}</b>` : '')
    + ((ind.today || []).some((p) => p.missed) ? ' · <span style="color:var(--err)">今天有错过的时段</span>' : '');
  $('#footLine').textContent = `榜单每日 ${d.hour ?? 8} 点更新 · 试发均为「仅自己可见」`;
}
function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

$$('#chips .hchip[data-m]').forEach((b) => b.onclick = () => {
  METRIC = b.dataset.m;
  $$('#chips .hchip[data-m]').forEach((x) => x.classList.toggle('on', x === b));
  render();
});
$('#refreshBtn').onclick = async () => {
  $('#refreshBtn').disabled = true;
  try { await api('api/xhs-radar/run', {}); } catch (e) { toast('触发失败：' + e.message); }
  load();
};
$('#visBtn').onclick = () => { VIS = VIS === '公开可见' ? '仅自己可见' : '公开可见'; $('#visBtn').textContent = VIS === '公开可见' ? '公开' : '仅自己'; };
$('#fileInput').onchange = async (e) => {
  const files = [...(e.target.files || [])].slice(0, 9 - IMGS.length);
  e.target.value = '';
  for (const f of files) {
    try {
      const bmp = await createImageBitmap(f);
      const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas');
      c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      const type = scale === 1 && f.type === 'image/png' ? 'image/png' : 'image/jpeg';
      IMGS.push({ name: f.name, dataUrl: c.toDataURL(type, 0.9) });
    } catch {}
  }
  renderImgs();
  updateSend();
};
function renderImgs() {
  $('#imgs').innerHTML = IMGS.map((im, i) => `<span class="hcompose-img"><img src="${im.dataUrl}"><button type="button" class="hcompose-del" data-i="${i}">×</button></span>`).join('');
  $$('#imgs .hcompose-del').forEach((b) => b.onclick = () => { IMGS.splice(+b.dataset.i, 1); renderImgs(); updateSend(); });
}
function updateSend() { $('#sendBtn').disabled = !!BUSY || (!$('#compose').value.trim() && !IMGS.length); }
$('#compose').addEventListener('input', updateSend);
$('#sendBtn').onclick = async () => {
  const topic = $('#compose').value.trim();
  if (!topic && !IMGS.length) return;
  BUSY = 'custom'; updateSend();
  try {
    const r = await api('api/xhs-radar/custom', { topic, visibility: VIS, images: IMGS });
    if (r.threadId) { $('#compose').value = ''; IMGS = []; renderImgs(); toast('已发起发布，可在工作台查看该会话进度'); }
    else window.alert('发布失败：' + (r.error || '未知错误'));
  } catch (e) { window.alert('发布失败：' + e.message); }
  BUSY = ''; updateSend();
};
$$('.hfoot-btn').forEach((b) => b.onclick = async () => {
  BUSY = b.dataset.type;
  $$('.hfoot-btn').forEach((x) => (x.disabled = true));
  try {
    const r = await api('api/xhs-radar/autopost', { visibility: '仅自己可见', type: b.dataset.type });
    toast(r.threadId ? '已发起试发，可在工作台查看该会话' : '试发失败：' + (r.error || '未知错误'));
  } catch (e) { window.alert('试发失败：' + e.message); }
  BUSY = ''; $$('.hfoot-btn').forEach((x) => (x.disabled = false));
});
load();
</script>
</body>
</html>
