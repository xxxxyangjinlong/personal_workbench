# indexChat 发布配置        用法:  deploy indexChat              （默认环境 208）
[project]
kind = jar
dir = ~/IdeaProjects/indexChat
build_java_home = ~/Library/Java/JavaVirtualMachines/ms-21.0.11/Contents/Home
mvn = ~/maven/apache-maven-3.6.2/bin/mvn
build = {mvn} -f backend/pom.xml clean package -DskipTests
artifact = backend/target/harnesschat-backend-1.0-SNAPSHOT.jar
start_cmd = nohup {java} -jar {jar}
default_env = 208

[env:208]
host = 208
path = /usr/local/src/indexChat
java = /usr/lib/jvm/amazon-corretto-21.0.12.8.1-linux-x64/bin/java
